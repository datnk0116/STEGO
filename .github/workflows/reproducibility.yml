name: Reproducible steganography project

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stego-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv and project dependencies
        run: |
          python -m pip install --upgrade uv
          uv pip install --system -r requirements.txt

      - name: Install report and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-noto-core zip

      - name: Prepare evidence folders
        run: |
          mkdir -p results/logs results/blue3/figures results/blue3/robustness
          mkdir -p results/sleepy_alarm results/submission

      - name: Record environment
        run: |
          python scripts/check_environment.py | tee results/logs/environment.txt
          python - <<'PY'
          import json, platform, sys
          from importlib.metadata import version
          packages = ["Pillow", "numpy", "scipy", "matplotlib", "soundfile", "python-docx"]
          data = {
              "platform": platform.platform(),
              "architecture": platform.machine(),
              "python": sys.version,
              "packages": {name: version(name) for name in packages},
          }
          with open("results/environment.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          PY

      - name: Verify official artifact sizes and SHA-256
        run: |
          python scripts/download_artifacts.py all | tee results/logs/artifact-download.txt
          shasum -a 256 data/blue3/blue.png data/sleepy_alarm/*.mp3 | tee results/logs/artifact-sha256.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sources = {
              "data/blue3/blue.png": "https://github.com/BYU-CSA/old-ctf-challenges/tree/master/forensics-steganography/blue-3",
              "data/sleepy_alarm/morning_n_breakfast.mp3": "https://github.com/ImaginaryCTF/ImaginaryCTF-2024-Challenges/tree/main/Forensics/Sleepy%20Alarm",
              "data/sleepy_alarm/morning_n_breakfast_original.mp3": "https://github.com/ImaginaryCTF/ImaginaryCTF-2024-Challenges/tree/main/Forensics/Sleepy%20Alarm",
          }
          manifest = []
          for name, source in sources.items():
              path = Path(name)
              manifest.append({
                  "path": name, "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "source": source,
              })
          Path("results/artifact_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: Run synthetic regression tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee results/logs/unit-tests.log

      - name: Reproduce Blue 3 and robustness tests
        id: blue3
        run: |
          set -o pipefail
          python src/blue3/analyze.py data/blue3/blue.png             --output results/blue3/analysis.json             2>&1 | tee results/logs/blue3-analysis.log
          python src/solve_challenges.py blue3 data/blue3/blue.png             2>&1 | tee results/logs/blue3-solver.log
          python src/blue3/visualize.py data/blue3/blue.png             --length 50 --out-dir results/blue3/figures             2>&1 | tee results/logs/blue3-visualize.log
          python src/experiments/blue3_robustness.py data/blue3/blue.png             --out results/blue3/robustness             2>&1 | tee results/logs/blue3-robustness.log

      - name: Analyze official Sleepy Alarm MP3 pair
        id: audio_analysis
        run: |
          set -o pipefail
          python src/sleepy_alarm/analyze.py             data/sleepy_alarm/morning_n_breakfast.mp3             --reference data/sleepy_alarm/morning_n_breakfast_original.mp3             --out-dir results/sleepy_alarm             > results/sleepy_alarm/analysis.json

      - name: Decode Sleepy Alarm and verify the full official flag
        id: sleepy
        continue-on-error: true
        run: |
          python src/solve_challenges.py sleepy-alarm             data/sleepy_alarm/morning_n_breakfast.mp3             --reference data/sleepy_alarm/morning_n_breakfast_original.mp3             --expected 'ictf{1_sl33py_NaYuKi_alarm_2a634dc1bb2}'             > results/sleepy_alarm/solver.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/sleepy_alarm/solver.json").read_text())
          if not result.get("success") or not result.get("ground_truth_match"):
              raise SystemExit("Sleepy Alarm did not match the complete official flag.")
          print("Sleepy Alarm exact ground-truth verification: PASS")
          PY

      - name: Run paired Sleepy Alarm robustness tests
        if: steps.sleepy.outcome == 'success'
        run: |
          mkdir -p results/sleepy_alarm/robustness
          python src/experiments/sleepy_alarm_robustness.py             data/sleepy_alarm/morning_n_breakfast.mp3             --reference data/sleepy_alarm/morning_n_breakfast_original.mp3             --expected 'ictf{1_sl33py_NaYuKi_alarm_2a634dc1bb2}'             --out-dir results/sleepy_alarm/robustness             > results/sleepy_alarm/robustness/run.json

      - name: Build draft or verified PDF and source ZIP
        if: always() && !cancelled() && steps.blue3.outcome == 'success' && steps.audio_analysis.outcome == 'success'
        run: |
          python scripts/build_submission.py --max-main-pages 15

      - name: Upload all run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stego-reproducibility-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated evidence to main
        if: always() && !cancelled()
        run: |
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping evidence commit from stale run $GITHUB_SHA; main is now $remote_sha."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "test: add reproducible analysis outputs [skip ci]"
            git push origin HEAD:main
          else
            echo "No generated evidence changes to commit."
          fi

      - name: Fail the job when Sleepy Alarm has not been verified
        if: always() && !cancelled() && steps.sleepy.outcome != 'success'
        run: |
          echo "::error::Sleepy Alarm has not yet matched the full official 39-character flag."
          exit 1
